# Triển khai agent-web (Agent/backend/web/app.py) bằng Docker -- CHƯA chạy,
# chỉ là cấu hình chờ duyệt. Xem Agent/docker/README.md để biết thứ tự thao
# tác đầy đủ (kể cả những bước bắt buộc cần người thật làm: DNS, certbot).
#
# Cách ly với 6 container đang chạy trên host (fms-frontend, fms-backend,
# fms-mongodb, giapha-db, nora-tg-bot, nora-vault-sync) và với MySQL/MongoDB/
# PHP-FPM/nginx chạy trực tiếp trên host:
#   - Không khai báo `networks:` dùng chung -- Compose tự tạo một network
#     riêng cho project này, không tham gia network của container nào khác.
#   - Không mount volume nào ngoài Agent/data của chính dự án này.
#   - Cổng duy nhất chạm ra ngoài container là 8770, và chỉ bind vào loopback
#     của HOST (127.0.0.1) -- không bao giờ 0.0.0.0. nginx chạy trên host
#     (ngoài Docker) là lớp duy nhất chạm internet, xem
#     Agent/nginx/nginx-agent.conf.template.
#   - Tài nguyên bị ép trần cứng (cpus/mem_limit dưới đây) nên dù agent-web
#     có lỗi/leak cũng không thể kéo sập MySQL/MongoDB/PHP-FPM hay 6
#     container kia trên cùng máy 24 core/30GB.
#   - Nếu container này chết/bị OOM-kill, `restart: unless-stopped` tự khởi
#     động lại nó -- không có tiến trình nào khác trên host phụ thuộc vào nó
#     nên việc nó down không lan sang dịch vụ khác, và ngược lại.

# TÊN PROJECT CỐ ĐỊNH. Không đặt thì Compose lấy TÊN THƯ MỤC chứa file này
# làm tên project -- nên lúc thư mục đổi từ `deploy/` sang `docker/`, Compose
# coi đây là một project khác và đòi tạo container trùng tên với bộ đang
# chạy. Khoá tên ở đây để mọi lần đổi chỗ file về sau đều vô hại.
name: norabt-agent

services:
  agent-web:
    build:
      # Context = Agent/ (một cấp trên docker/), không phải repo root và
      # không phải docker/ -- Dockerfile cần COPY Agent/backend +
      # Agent/requirements.txt, mà Docker cấm COPY ra ngoài context qua "..".
      # Xem đầu Agent/docker/Dockerfile và Agent/docker/.dockerignore để biết
      # lý do đầy đủ.
      context: ..
      dockerfile: docker/Dockerfile
    image: norabt-agent-web:latest
    container_name: norabt-agent-web

    # Run as the host's own uid:gid, not the image's baked-in agent(10001).
    # The candle cache is a bind mount owned by host uid 1000; a container uid
    # that doesn't match simply cannot write it (Permission denied on the
    # atomic-write temp file), and chowning the host dir to 10001 would just
    # move the problem onto the host user instead. Still non-root either way.
    user: "1000:1000"
    restart: unless-stopped

    # Snapshot Redis (GET /bot/<code> cache) giờ là service `agent-redis`
    # riêng của project này (định nghĩa cuối file), nằm trên CÙNG mạng bridge
    # mặc định mà Compose tự tạo cho project này -- nên agent-web gọi thẳng
    # tới nó bằng tên service (`redis://agent-redis:6379`, xem
    # Agent/.env.example's NORABT_SNAPSHOT_REDIS_URL), không cần
    # extra_hosts/host.docker.internal nữa. Lịch sử: từng thử trỏ tới
    # `norabt-redis` (Redis dùng chung với dự án "nora", chạy
    # `network: host`) qua host.docker.internal:host-gateway, nhưng đo được
    # trên hạ tầng thật là KHÔNG BAO GIỜ tới được -- `norabt-redis` chỉ bind
    # 127.0.0.1 của HOST nên bridge network luôn bị từ chối kết nối ngay
    # ("connection refused"). Cấp hẳn agent-redis riêng giải quyết dứt điểm,
    # xem README phần Redis để biết đầy đủ lý do đổi hướng.
    depends_on:
      agent-redis:
        # Chỉ ảnh hưởng THỨ TỰ khởi động (đợi agent-redis healthy trước khi
        # tạo agent-web) -- KHÔNG biến Redis thành phụ thuộc cứng. Nếu
        # agent-redis chết SAU KHI cả hai đã lên, agent-web không bị
        # Compose/Docker khởi động lại hay đánh unhealthy vì việc đó -- đúng
        # tinh thần "đây là bộ đệm, không phải kho dữ liệu chính thức" của
        # snapshot.py (xem module docstring): mọi request khi đó chỉ đơn
        # giản rơi về chấm điểm trực tiếp, /healthz báo "unreachable", trang
        # vẫn phục vụ HTTP 200 bình thường.
        condition: service_healthy

    # CHỈ bind vào loopback của HOST. Tuyệt đối không đổi thành "8770:8770"
    # hay "0.0.0.0:8770:8770" -- làm vậy là mở thẳng cổng 8770 ra internet,
    # bỏ qua toàn bộ rate limit/TLS/kiểm soát truy cập nginx đang lo (server
    # Starlette phía sau chưa có xác thực riêng, xem web/app.py's docstring).
    ports:
      - "127.0.0.1:8770:8770"

    env_file:
      # Nạp OKX_API_KEY/OKX_API_SECRET/OKX_API_PASSPHRASE/OKX_SIMULATED (và
      # mọi biến khác trong Agent/.env, xem Agent/.env.example) làm biến môi
      # trường THẬT của tiến trình lúc "docker compose up". File .env không
      # bao giờ được copy vào image (xem Dockerfile + .dockerignore) -- nó
      # chỉ tồn tại trên host và chỉ compose đọc nó ở bước này. Nếu file này
      # chưa tồn tại, `docker compose` sẽ báo lỗi ngay thay vì âm thầm chạy
      # thiếu credentials -- đây là hành vi mong muốn, xem README bước 3.
      - ../.env

    volumes:
      # Toàn bộ Agent/data chỉ-đọc: run_report.py/crawler ghi dữ liệu này từ
      # NGOÀI container (chạy trực tiếp trên host), agent-web chỉ cần đọc lại
      # (list_bots/list_markets trong web/data.py là plain JSON read).
      - ../data:/app/Agent/data:ro

      # Backend code mounted read-only for live updates without full rebuilds.
      - ../backend:/app/Agent/backend:ro

      # Bản build SPA và bảng design token: soạn ngoài backend/ và CỐ Ý không
      # nướng vào image -- chúng đổi thường xuyên hơn mã, bind chỉ-đọc nên
      # sửa xong chỉ cần tải lại trình duyệt, không phải build lại image.
      # Mount ĐÚNG HAI đường này chứ không mount cả ../frontend: thư mục đó
      # chứa node_modules 47 MB mà container không bao giờ cần.
      - ../frontend/dist:/app/Agent/frontend/dist:ro
      - ../frontend/tokens.css:/app/Agent/frontend/tokens.css:ro
      # Ngoại lệ duy nhất: cache nến 1H đã đóng, đường dẫn mặc định của
      # CandleCache (xem Agent/backend/sources/market_source.py --
      # Path(config.DATA_DIR)/"cache"/"candles"). LiveMarketDataSource tự ghi
      # thêm vào cache này mỗi khi POST /api/analyze cần nến của một mã mới,
      # nên riêng nhánh con này phải cho ghi -- mount SAU dòng data:ro ở trên
      # để nó override đúng một nhánh con thành rw, phần còn lại của data/
      # vẫn chỉ-đọc (hai mount trỏ tới hai target khác nhau trong container
      # nên thứ tự liệt kê ở đây không ảnh hưởng tới kết quả, chỉ giữ để dễ
      # đọc: cha trước, con sau).
      - ../data/cache/candles:/app/Agent/data/cache/candles:rw

      # Nhánh con ghi-được thứ hai, CÙNG KHUÔN với candles ở trên: wallet-
      # address identity (Agent/backend/web/identity.py) tạo/cập nhật hồ sơ
      # người dùng tại data/users/<user_ref>/profile.json ngay TRONG
      # container này mỗi khi có người khai địa chỉ ví qua POST /api/session
      # hoặc chấm điểm một bot lúc đã đăng nhập (POST /api/analyze gọi
      # identity.record_analysis) -- khác hẳn candles/cache (agent-web tự
      # ghi cache nến của chính nó) và khác hẳn phần còn lại của data/ (bot/
      # đánh giá do run_report.py/crawler ghi từ NGOÀI container, xem comment
      # data:ro ở trên) -- đây là dữ liệu do CHÍNH tiến trình bên trong
      # container này sinh ra, nên nhánh này PHẢI ghi được, còn mọi nhánh con
      # khác của data/ (assessment, analysis, universe, ...) vẫn giữ nguyên
      # chỉ-đọc như trước: agent-web không có lý do gì để tự ghi vào đó.
      # Mount SAU dòng data:ro ở trên để override đúng một nhánh con thành
      # rw, giống hệt cơ chế candles (hai mount trỏ tới hai target khác nhau
      # trong container nên thứ tự liệt kê ở đây không ảnh hưởng tới kết
      # quả, chỉ giữ để dễ đọc: cha trước, con sau).
      #
      # BẮT BUỘC trước lần "docker compose up" đầu tiên: thư mục
      # Agent/data/users/ trên HOST phải đã tồn tại VÀ thuộc quyền uid 1000
      # (host user chạy compose) trước khi container khởi động -- nếu chưa
      # có, Docker tự tạo nó lúc mount và gán quyền root, và container này
      # (chạy `user: "1000:1000"`, xem trên) vẫn không ghi được vào một thư
      # mục do root tạo, tái diễn ĐÚNG lỗi mount chỉ-đọc mà nhánh mount này
      # định sửa. Xem README bước tạo thư mục kèm .gitkeep.
      # Ngoại lệ ghi-được: thư mục kết quả chấm điểm. Nút "Phân tích lại"
      # (`/bot/<code>?refresh=1`) chạy lại bot rồi GHI ĐÈ `assessment.json`
      # của nó ở luồng nền -- không ghi được thì lượt chạy lại chỉ sống
      # trong snapshot Redis 24 giờ, hết hạn là hệ thống đọc lại bản cũ và
      # công của người dùng bị vứt đi.
      #
      # ĐÃ CẮN THẬT: tính năng này được viết và nối đúng, nhưng trong
      # container nó chết ở `OSError: [Errno 30] Read-only file system`
      # sau khi đã tốn 85 giây gọi mô hình. Lỗi xảy ra trong luồng nền và
      # chỉ vào log, nên từ phía người dùng trang vẫn trả 200 như thường --
      # không có dấu hiệu nào cho thấy kết quả không được lưu.
      #
      # Phạm vi hẹp nhất có thể: chỉ `data/assessment`, phần còn lại của
      # `data/` vẫn chỉ-đọc.
      - ../data/assessment:/app/Agent/data/assessment:rw
      - ../data/users:/app/Agent/data/users:rw

      # Nhánh con ghi-được thứ ba, CÙNG KHUÔN với users/ ở trên: kho mã
      # lượt-dùng ẩn danh (Agent/backend/web/usage_ref.py, Việc 2) --
      # POST/GET /api/analyze tự đúc một file mới ở đây (data/usage_refs/
      # <ref>.json) cho MỖI lượt phân tích thành công của một caller KHÔNG
      # đăng nhập (chính là luồng OKX), để link chi tiết trả về không mang
      # theo mã bot đoán-được (`/bot/<code>`) và cũng không trộn vào hồ sơ
      # người dùng thật ở data/users/ -- xem usage_ref.py's own module
      # docstring cho đầy đủ lý do tách kho. Cùng lý do BẮT BUỘC tạo trước
      # + chown uid 1000 như data/users/ ở trên (xem README bước tạo thư
      # mục): nếu chưa có, Docker tự tạo nó thuộc quyền root lúc mount và
      # container (chạy user 1000:1000) không ghi được vào đó.
      - ../data/usage_refs:/app/Agent/data/usage_refs:rw

      # --- Nhận định chuyên môn (narrative) do Claude viết -- xem README
      # bước 12 và Agent/backend/qc/reporting/narrative.py's module
      # docstring cho đầy đủ thiết kế. Image KHÔNG cài Node/Claude Code --
      # binary `claude` (đo được: ELF 64-bit tự chứa 224MB, không cần Node
      # hay runtime nào khác) chỉ tồn tại TRÊN HOST, nên phải mount vào chứ
      # không cài vào image.
      #
      # Mount CẢ THƯ MỤC versions/ (không phải một file phiên bản cụ thể):
      # Claude Code tự cập nhật (thêm bản mới, trỏ lại symlink
      # ~/.local/bin/claude, giữ lại bản cũ) -- một đường dẫn có số phiên
      # bản gán cứng ("versions/2.1.270") sẽ CHẮC CHẮN biến mất sau một lần
      # cập nhật, làm mount rỗng và narrative âm thầm rơi về văn bản mẫu
      # mãi mãi mà không ai biết. narrative.py's resolve_claude_binary() tự
      # quét thư mục này, chọn bản SEMVER CAO NHẤT (so sánh từng phần dưới
      # dạng số nguyên, không so chuỗi -- tránh bẫy "2.1.9" > "2.1.10" khi
      # so bằng string), cache kết quả 45s nên một bản cập nhật trên HOST
      # được container nhận trong vòng chưa tới một phút, KHÔNG CẦN restart
      # container. Chỉ-đọc: container không bao giờ cần ghi vào đây.
      #
      # NORABT_CLAUDE_VERSIONS_DIR ở đây là biến MÔI TRƯỜNG CỦA SHELL đang
      # chạy lệnh `docker compose` (KHÔNG PHẢI biến trong Agent/.env -- đó
      # là hai cơ chế khác nhau: `${...}` được Compose thay thế NGAY LÚC
      # đọc file này, còn `env_file: ../.env` chỉ nạp biến vào bên TRONG
      # container). Để trống (mặc định) dùng đúng đường dẫn đã đo trên máy
      # chủ dự án này -- xem README bước 12 để biết cách lấy lại đường dẫn
      # này trên một máy khác (`dirname $(readlink -f $(which claude))`) và
      # cách ghi đè khi nó đổi.
      - ${NORABT_CLAUDE_VERSIONS_DIR:-/home/ubuntu/.local/share/claude/versions}:/opt/claude/versions:ro

      # Chỉ mount ĐÚNG MỘT FILE `.credentials.json` (509 byte, đo được) --
      # TUYỆT ĐỐI không mount cả `~/.claude/` (cây đó chứa lịch sử hội
      # thoại, file-history, cấu hình dự án của chính CHỦ máy chủ -- không
      # có lý do gì để container này đọc được) và không mount `~/.claude.json`
      # (74KB, cấu hình toàn cục khác, cũng không cần cho việc gọi
      # `claude -p`). Chỉ-đọc: container không bao giờ tự làm mới được
      # phiên đăng nhập này -- xem ghi chú giới hạn ở README bước 12.
      # `${HOME}` ở đây là HOME của user đang chạy `docker compose up`
      # (mặc định fallback về /home/ubuntu cho đúng user chạy compose trên
      # máy chủ dự án này, ghi đè được qua biến shell HOME như bình
      # thường).
      - ${HOME:-/home/ubuntu}/.claude/.credentials.json:/opt/agent-home/.claude/.credentials.json:ro

      # --- Backend `agy` (Gemini 3.8 Flash) -- backend ĐANG DÙNG ---------
      # Cùng lý do như `claude` ở trên: binary chỉ có trên host (ELF tự
      # chứa 209MB), image không cài. Khác một điểm QUAN TRỌNG: `agy` là
      # một file DUY NHẤT, không phải cây versions/ tự cập nhật, nên mount
      # thẳng file. Ghi đè đường dẫn host qua biến shell NORABT_AGY_BIN_HOST
      # nếu máy khác cài chỗ khác (`readlink -f $(which agy)`).
      - ${NORABT_AGY_BIN_HOST:-/home/ubuntu/.local/bin/agy}:/opt/agy/agy:ro

      # HOME GHI ĐƯỢC cho tiến trình con. Đây là khác biệt cốt lõi so với
      # `claude`: claude chỉ ĐỌC credential, còn agy GHI vào $HOME mỗi lượt
      # chạy (installation_id, conversations/, cache/, và cả
      # $HOME/.cache/ms-playwright-go). Thử trong container nháp với HOME
      # chỉ-đọc cho đúng lỗi này:
      #     Failed to start: open /opt/agent-home/.gemini/antigravity-cli/
      #     installation_id: permission denied
      # Thư mục host PHẢI tồn tại và thuộc uid 1000 TRƯỚC khi mount -- nếu
      # chưa có, Docker tạo nó thuộc root và tái diễn đúng lỗi trên (cùng
      # khuôn với data/users và data/usage_refs ở trên).
      #
      # CỐ Ý KHÔNG mount cả ~/.gemini của chủ máy: cây đó chứa history/,
      # antigravity-ide/ và hội thoại riêng. Chỉ một file token được sao
      # vào thư mục riêng này -- đúng nguyên tắc đã áp dụng cho
      # .credentials.json của claude. Đã đo: đây là file DUY NHẤT agy cần
      # để xác thực.
      - ${NORABT_AGENT_HOME:-/home/ubuntu/.norabt-agent-home}:/opt/agent-home:rw

    environment:
      # HOME riêng cho tiến trình agent-web bên trong container (KHÔNG phải
      # HOME dùng để tìm mount phía trên -- đó là HOME của SHELL chạy
      # compose trên host, một khái niệm hoàn toàn khác). `claude` CLI đọc
      # thông tin đăng nhập tại `$HOME/.claude/.credentials.json` -- đặt
      # HOME=/opt/claude-home để nó khớp đúng target của mount
      # `.credentials.json` ở trên. narrative.py's
      # `minimal_subprocess_environment` đã có sẵn "HOME" trong allow-list
      # truyền cho tiến trình con `claude`, nên chỉ cần đặt đúng biến này ở
      # cấp container là đủ, không cần sửa gì thêm trong code.
      # Đổi từ /opt/claude-home (chỉ-đọc, thuộc root) sang một HOME GHI
      # ĐƯỢC do host cấp: `agy` cần ghi, `claude` thì không quan tâm vì nó
      # chỉ đọc $HOME/.claude/.credentials.json -- mount ở trên đã trỏ
      # đúng vào đường dẫn mới nên cả hai backend vẫn tìm thấy thông tin
      # đăng nhập của mình.
      - HOME=/opt/agent-home

      # Đường dẫn binary `agy` BÊN TRONG container (khớp target mount ở
      # trên). Không đặt thì narrative.py tìm "agy" trong PATH và không
      # thấy -- image không cài nó.
      - NORABT_AGY_BIN=/opt/agy/agy

    # --- Giới hạn tài nguyên -----------------------------------------------
    # Ràng buộc cứng của dự án: TOÀN BỘ phần việc (không chỉ service này)
    # phải ≤12 core / ≤14GB RAM trên máy 24 core/30GB đã dùng ~8GB. Cấp 2
    # core / 2GB riêng cho agent-web là đủ, vì:
    #   - Monte Carlo (Agent/backend/mcp/analytics/simulation/monte_carlo.py,
    #     BATCH_SIZE = 2_000) chạy numpy THEO LÔ thay vì vector hoá toàn bộ số
    #     lần lặp cùng lúc -- đây chính là cơ chế chặn đỉnh RAM của phép mô
    #     phỏng nặng nhất trong POST /api/analyze, không phụ thuộc RAM cấp
    #     cho container.
    #   - Sổ lệnh (ledger) lớn nhất trong dataset hiện có nặng ~339KB JSON
    #     (539 lệnh, bot_2DE3E8FEAC245B9C/BTC) -- vài trăm KB, không phải vài
    #     trăm MB, nên phần parse + tính chỉ số tốn không đáng kể so với batch
    #     Monte Carlo ở trên.
    #   - POST /api/analyze đã tự giới hạn 5 request/phút/IP
    #     (ANALYZE_RATE_LIMIT_MAX_REQUESTS trong web/app.py), nên không một
    #     client nào có thể dồn nhiều lô Monte Carlo chạy đồng thời.
    #   - 2 core đủ cho vài request /api/analyze CPU-bound xen kẽ mà không
    #     giành CPU của MySQL/MongoDB/PHP-FPM hay 6 container khác đang chạy
    #     trên cùng máy 24 core.
    cpus: 2
    mem_limit: 2g
    # = mem_limit -- tắt swap thêm cho riêng container này. Vượt 2GB là dấu
    # hiệu bất thường (leak/bug), nên để nó bị OOM-kill và tự khởi động lại
    # (restart: unless-stopped) thay vì âm thầm tràn sang swap và kéo chậm cả
    # máy dùng chung với các dịch vụ khác.
    memswap_limit: 2g

    # Siết thêm ở tầng Linux, không đổi hành vi của ứng dụng: ảnh đã chạy
    # bằng user "agent" (không phải root, xem Dockerfile) nên tiến trình vốn
    # không cần bất kỳ capability đặc biệt hay quyền leo thang nào.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Giới hạn dung lượng log của Docker (json-file driver) -- log KHÔNG được
    # phép ăn hết đĩa của một máy đang chạy chung với 6 container khác + các
    # dịch vụ hệ thống. 10MB x 5 file = tối đa 50MB cho service này.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      # Dùng python3 sẵn có trong image thay vì cài thêm curl/wget -- image
      # runtime chủ đích không có gói nào ngoài các thư viện trong
      # requirements.txt, giữ bề mặt tấn công/kích thước tối thiểu.
      #
      # Gate theo NỘI DUNG JSON ("status": "ok"), không chỉ mã HTTP: route
      # /healthz (Agent/backend/web/app.py) luôn trả HTTP 200 kể cả khi
      # "degraded" (đọc đĩa lỗi) -- đúng quy ước "không bao giờ trả traceback
      # thô, luôn JSON sạch" của toàn bộ app -- nên healthcheck phải tự phân
      # biệt hai trường hợp đó bằng nội dung, không thể chỉ dựa vào mã HTTP.
      # OKX không phản hồi (`okx_public_reachable: false`) KHÔNG làm
      # healthcheck fail -- đó là điều kiện bên ngoài mà khởi động lại
      # container không sửa được, xem README phần "OKX chặn IP".
      test:
        - "CMD"
        - "python3"
        - "-c"
        - |
          import json, sys, urllib.request
          try:
              with urllib.request.urlopen("http://127.0.0.1:8770/healthz", timeout=5) as r:
                  body = json.load(r)
          except Exception:
              sys.exit(1)
          sys.exit(0 if body.get("status") == "ok" else 1)
      interval: 30s
      timeout: 5s
      retries: 3
      # Đủ thời gian cho lần khởi động đầu tiên (import numpy/pydantic +
      # dựng WebDataService) trước khi một lần healthcheck thất bại bắt đầu
      # được tính vào "retries".
      start_period: 20s

  # Redis RIÊNG của agent, KHÔNG PHẢI norabt-redis (dự án "nora" dùng chung
  # với 6 container khác trên host). Lý do tách hẳn thay vì cố với tới
  # norabt-redis: norabt-redis chạy `network_mode: host` và Redis bên trong
  # nó CHỈ bind 127.0.0.1 -- tức loopback CỦA HOST, không phải của bất kỳ
  # container bridge nào. agent-web nằm trên mạng bridge riêng của project
  # này (deploy_default) nên một kết nối tới norabt-redis luôn bị kernel từ
  # chối ngay ("connection refused"), bất kể extra_hosts/host.docker.internal
  # có khai báo đúng cách mấy -- đã đo trực tiếp trên hạ tầng thật, xem
  # README phần Redis. Mở thêm bind cho norabt-redis để nhận kết nối từ
  # bridge network là thay đổi vận hành của DỰ ÁN KHÁC (nới bind của một
  # Redis không mật khẩu ra khỏi loopback thuần), nên KHÔNG làm; cấp hẳn một
  # Redis mới, nhỏ, riêng cho agent là lựa chọn không đụng gì tới nora.
  agent-redis:
    image: redis:7-alpine
    container_name: norabt-agent-redis
    restart: unless-stopped

    # KHÔNG publish cổng nào ra host (không có mục `ports:` ở đây) -- chỉ
    # agent-web, đứng cùng mạng bridge mặc định mà Compose tự tạo cho
    # project này, gọi được tới nó qua tên service "agent-redis:6379". Một
    # Redis không đặt mật khẩu (`requirepass`) mà lỡ mở cổng ra host/internet
    # là mời bất kỳ ai biết địa chỉ vào đọc/ghi/xoá dữ liệu -- ở đây dữ liệu
    # chỉ là cache nên rủi ro thấp, nhưng "không publish" vẫn là lựa chọn
    # đúng mặc định: không có lý do gì để bất kỳ tiến trình nào ngoài
    # agent-web trên máy này chạm được vào nó.
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru

    # --save "" và --appendonly no: tắt hoàn toàn RDB snapshot lẫn AOF. Dữ
    # liệu trong Redis này (xem Agent/backend/web/snapshot.py) là BỘ ĐỆM tái
    # tạo được -- mất là chấm điểm lại từ đầu, không phải mất dữ liệu gốc
    # (WebDataService.analyze() + Agent/data mới là nguồn sự thật). Tắt lưu
    # bền nghĩa là không có file .rdb/.aof nào đọng lại trên đĩa host qua
    # các lần restart, và mỗi lần khởi động lại container này luôn là một
    # cache trống-sạch, không có "hồi sinh" dữ liệu cũ ngoài ý muốn.

    # --maxmemory 128mb --maxmemory-policy allkeys-lru: chặn trần bộ nhớ
    # RIÊNG của Redis này (cộng với mem_limit ở cấp container ngay dưới) --
    # nằm gọn trong ràng buộc cứng của dự án là TOÀN BỘ phần việc (không chỉ
    # service này) phải ≤12 core/≤14GB RAM trên máy 24 core/30GB đã dùng
    # ~8GB. Chính sách allkeys-lru (không phải noeviction) nghĩa là khi đầy,
    # Redis tự loại khoá cũ nhất thay vì trả lỗi ghi -- đúng tinh thần "bộ
    # đệm, mất thì thôi" của snapshot.py (SNAPSHOT_MAX_BYTES + TTL 24h đã tự
    # giới hạn từng khoá/tuổi thọ, 128MB chỉ là lớp chặn tổng cuối cùng).

    # 192m > 128mb maxmemory ở trên: chừa khoảng đệm cho overhead của chính
    # tiến trình redis-server (kết nối, cấu trúc dữ liệu nội bộ...) nằm
    # ngoài phần dữ liệu đếm vào maxmemory, để container không bị cgroup
    # OOM-kill ngay sát ngưỡng dữ liệu.
    mem_limit: 192m
    memswap_limit: 192m

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
