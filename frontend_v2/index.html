<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nora 2.0 Terminal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --panel-bg: rgba(22, 28, 45, 0.7);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #60a5fa;
            --success: #10b981;
            --danger: #ef4444;
            --border: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Glassmorphism Background */
        .bg-blobs {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }
        .blob {
            position: absolute;
            filter: blur(80px);
            opacity: 0.4;
            border-radius: 50%;
            animation: float 10s infinite ease-in-out alternate;
        }
        .blob-1 { top: -10%; left: -10%; width: 500px; height: 500px; background: #3b82f6; }
        .blob-2 { bottom: -10%; right: -10%; width: 600px; height: 600px; background: #8b5cf6; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.5);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 350px;
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        h2 { margin-top: 0; font-size: 18px; color: var(--text-main); font-weight: 600; margin-bottom: 16px; }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label { font-size: 14px; color: var(--text-muted); font-weight: 600; }

        input, select {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3); }

        button {
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(59, 130, 246, 0.6); }
        button:active { transform: translateY(0); }

        /* Loader */
        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s infinite linear;
            display: none;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }
        .metric-card {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            transition: transform 0.3s;
        }
        .metric-card:hover { transform: translateY(-4px); }
        .metric-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px;}
        .metric-value { font-size: 28px; font-weight: 700; }
        .value-green { color: var(--success); }
        .value-red { color: var(--danger); }

        /* Table */
        .table-container { flex: 1; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { text-align: left; padding: 12px; color: var(--text-muted); position: sticky; top: 0; background: rgba(22, 28, 45, 0.95); backdrop-filter: blur(10px); }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        tr:hover td { background: rgba(255,255,255,0.02); }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge.long { background: rgba(16, 185, 129, 0.2); color: var(--success); }
        .badge.short { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        #chart-container { flex: 1; width: 100%; min-height: 400px; border-radius: 8px; overflow: hidden; background: rgba(0,0,0,0.3);}

    </style>
</head>
<body>
    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <header>
        <h1>Nora 2.0 Engine</h1>
        <div style="font-size: 14px; color: var(--text-muted);">Decoupled • Real-time • In-Memory</div>
    </header>

    <div class="container">
        <!-- Sidebar -->
        <div class="sidebar">
            <h2>Strategy Configuration</h2>
            
            <div class="form-group">
                <label>Symbol</label>
                <select id="symbol">
                    <option value="APTUSDT">APTUSDT (4H)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Strategy Type</label>
                <select id="strategy">
                    <option value="keltner">Keltner Channel</option>
                </select>
            </div>

            <div class="form-group">
                <label>Length (KC)</label>
                <input type="number" id="length" value="17" />
            </div>

            <div class="form-group">
                <label>Multiplier (KC)</label>
                <input type="number" id="multiplier" step="0.1" value="0.5" />
            </div>

            <div class="form-group">
                <label>Start Date</label>
                <input type="datetime-local" id="start_date" value="2025-01-01T00:00" />
            </div>

            <div class="form-group">
                <label>End Date</label>
                <input type="datetime-local" id="end_date" value="2025-01-10T00:00" />
            </div>

            <button id="run-btn" onclick="runBacktest()">
                <span id="btn-text">RUN BACKTEST V2</span>
                <div class="spinner" id="spinner"></div>
            </button>

            <div id="time-taken" style="text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 10px;"></div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Metrics -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-title">Winrate</div>
                    <div class="metric-value" id="winrate">--%</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Total PnL</div>
                    <div class="metric-value" id="pnl">--%</div>
                </div>
                <div class="metric-card">
                    <div class="metric-title">Total Trades</div>
                    <div class="metric-value" id="trades">--</div>
                </div>
            </div>

            <!-- Table -->
            <div class="panel">
                <h2>Trade History</h2>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Type</th>
                                <th>Entry Time</th>
                                <th>Entry Price</th>
                                <th>Exit Time</th>
                                <th>Exit Price</th>
                                <th>PnL</th>
                                <th>Reason</th>
                            </tr>
                        </thead>
                        <tbody id="trade-body">
                            <tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No data. Run backtest to see results.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const res = await fetch('/api/v2/symbols');
                const symbols = await res.json();
                const sel = document.getElementById('symbol');
                if (symbols && symbols.length > 0) {
                    sel.innerHTML = symbols.map(s => `<option value="${s}" ${s === 'APTUSDT' ? 'selected' : ''}>${s} (4H)</option>`).join('');
                }
            } catch (e) {
                console.error("Failed to load symbols:", e);
            }
        });

        function formatDateStr(ts) {
            if (!ts) return "OPEN";
            const d = new Date(ts);
            return d.toLocaleString('vi-VN');
        }

        async function runBacktest() {
            const btn = document.getElementById('run-btn');
            const spinner = document.getElementById('spinner');
            const btnText = document.getElementById('btn-text');
            const timeTaken = document.getElementById('time-taken');
            
            // UI state
            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = 'CALCULATING...';
            timeTaken.innerText = '';
            
            const startDt = new Date(document.getElementById('start_date').value.replace('T', ' ') + ':00+07:00');
            const endDt = new Date(document.getElementById('end_date').value.replace('T', ' ') + ':00+07:00');

            const payload = {
                account_id: 3379,
                campaign_id: 1,
                symbol: document.getElementById('symbol').value,
                start_ts: startDt.getTime(),
                end_ts: endDt.getTime(),
                strategy_name: document.getElementById('strategy').value,
                extra_params: {
                    length: parseInt(document.getElementById('length').value),
                    multiplier: parseFloat(document.getElementById('multiplier').value)
                }
            };

            const t0 = performance.now();

            try {
                const res = await fetch('/api/v2/backtest/run', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                
                if(!res.ok) {
                    throw new Error(JSON.stringify(data));
                }

                const t1 = performance.now();
                timeTaken.innerText = `Engine completed in ${((t1 - t0) / 1000).toFixed(2)}s`;

                // Update Metrics
                document.getElementById('winrate').innerText = data.metrics.winrate + '%';
                
                const pnlEl = document.getElementById('pnl');
                pnlEl.innerText = data.metrics.total_pnl_pct + '%';
                pnlEl.className = 'metric-value ' + (data.metrics.total_pnl_pct >= 0 ? 'value-green' : 'value-red');
                
                document.getElementById('trades').innerText = data.metrics.total_trades;

                // Update Table
                const tbody = document.getElementById('trade-body');
                tbody.innerHTML = '';
                
                if (data.trades && data.trades.length > 0) {
                    data.trades.forEach(p => {
                        const tr = document.createElement('tr');
                        
                        const typeClass = p.type === 'LONG' ? 'long' : 'short';
                        const pnlClass = p.pnl_pct >= 0 ? 'value-green' : 'value-red';
                        
                        tr.innerHTML = `
                            <td><span class="badge ${typeClass}">${p.type}</span></td>
                            <td>${formatDateStr(p.enter_time)}</td>
                            <td>${p.enter_price.toFixed(4)}</td>
                            <td>${formatDateStr(p.close_time)}</td>
                            <td>${(p.close_price || 0).toFixed(4)}</td>
                            <td class="${pnlClass}">${p.pnl_pct.toFixed(2)}%</td>
                            <td><span style="color:var(--text-muted); font-size:12px;">${p.reason || 'N/A'}</span></td>
                        `;
                        tbody.appendChild(tr);
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; color: var(--text-muted);">No trades found.</td></tr>';
                }

            } catch (err) {
                console.error(err);
                alert("API Error! " + err.message);
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = 'RUN BACKTEST V2';
            }
        }
    </script>
</body>
</html>
