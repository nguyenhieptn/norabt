<html>
<body>
    <div id="root"></div>
	<textarea id="socketin"></textarea>
	<button onclick="sendSocket()">Send</button>
    <script>
        var host = 'wss://realtime-iboard.ssi.com.vn/graphql';
        var socket = new WebSocket(host, 'graphql-ws');
        socket.onmessage = function(e) {
            document.getElementById('root').innerHTML = e.data;
        };
		
		function sendSocket(){
			var socketIn = document.getElementById('socketin');
			var value = socketIn.value
			console.log(value)
			socket.send(value)
		}
    </script>
</body>
</html>
